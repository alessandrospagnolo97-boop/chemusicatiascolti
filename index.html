<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I miei album preferiti</title>
<style>
  :root { --bg:#f6f4ef; --fg:#1a1a1a; --muted:#6b6b66; --line:#dcd8cf; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#f1efe9; --muted:#9a9890; --line:#2e2e2b; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin:0; background:var(--bg); color:var(--fg); min-height:100vh;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; padding-bottom:48px; }
  header { padding:48px 6vw 16px; }
  h1 { margin:0 0 8px; font-size:clamp(28px,5vw,52px); letter-spacing:-0.03em; }
  header p { margin:0; color:var(--muted); max-width:52ch; line-height:1.5; }

  /* Indice dei generi */
  nav { position:sticky; top:0; z-index:5; background:var(--bg); display:flex; align-items:center; gap:14px; padding:10px 6vw; }
  .current { font-size:15px; font-weight:600; }
  /* Menu laterale */
  .burger { width:44px; height:44px; padding:0; border:1px solid var(--line); border-radius:50%; background:var(--bg);
    cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
  .burger span { display:block; width:18px; height:2px; border-radius:2px; background:var(--fg); }
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .25s; z-index:9; }
  #drawer { position:fixed; top:0; left:0; bottom:0; width:min(82vw,300px); z-index:10; display:flex; flex-direction:column;
    background:var(--bg); border-right:1px solid var(--line); transform:translateX(-100%); visibility:hidden;
    transition:transform .25s ease, visibility 0s .25s; }
  body.menu-open { overflow:hidden; }
  body.menu-open #drawer { transform:none; visibility:visible; transition:transform .25s ease; }
  body.menu-open .scrim { opacity:1; pointer-events:auto; }
  .drawer-head { display:flex; align-items:center; justify-content:space-between; padding:18px 20px 10px; font-weight:600; font-size:18px; }
  .drawer-head button { width:40px; height:40px; border:0; background:none; color:var(--fg); font-size:28px; line-height:1; cursor:pointer; }
  #drawer ul { list-style:none; margin:0; padding:0 0 max(16px,env(safe-area-inset-bottom)); overflow-y:auto; flex:1; }
  #drawer li button { width:100%; min-height:48px; padding:12px 20px; border:0; background:none; color:var(--fg); font:inherit; font-size:16px;
    display:flex; justify-content:space-between; align-items:center; gap:12px; text-align:left; cursor:pointer; }
  #drawer li button small { color:var(--muted); font-size:13px; }
  #drawer li button:hover, #drawer li button.active { background:var(--fg); color:var(--bg); }
  #drawer li button.active small, #drawer li button:hover small { color:inherit; opacity:.7; }

  /* Con un solo genere selezionato: griglia a capo invece dello scorrimento orizzontale */
  main.single .gallery { flex-wrap:wrap; overflow-x:visible; }
  main.single .arrow { display:none !important; }

  /* Vista "Tutti": un'unica griglia con tutti gli album, senza titoli di genere */
  main.all { display:flex; flex-wrap:wrap; gap:20px; padding:24px 6vw 0; }
  main.all .genre, main.all .wrap, main.all .gallery { display:contents; }
  main.all .genre h2, main.all .arrow { display:none; }

  /* Sezione genere */
  .genre { margin-top:36px; }
  .genre[hidden] { display:none; }
  .genre h2 { margin:0; padding:0 6vw; font-size:clamp(20px,3vw,28px); letter-spacing:-0.02em;
    display:flex; align-items:baseline; gap:10px; }
  .genre h2 span { font-size:13px; color:var(--muted); font-weight:400; letter-spacing:0; }

  .wrap { position:relative; }
  .gallery { display:flex; gap:20px; overflow-x:auto; scroll-snap-type:x proximity;
    padding:16px 6vw 20px; scroll-behavior:smooth; scrollbar-width:thin; }
  .album { flex:0 0 auto; width:clamp(150px,20vw,220px); scroll-snap-align:start; }
  .album a { color:inherit; text-decoration:none; display:block; }
  .cover { width:100%; aspect-ratio:1; object-fit:cover; display:block; border-radius:6px;
    background:var(--line); box-shadow:0 8px 24px rgba(0,0,0,.18); transition:transform .2s; }
  .album a:hover .cover { transform:translateY(-4px); }
  .title { margin:12px 0 2px; font-weight:600; font-size:15px; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .artist { margin:0; color:var(--muted); font-size:13px; }
  .skeleton .cover { animation:pulse 1.2s ease-in-out infinite; box-shadow:none; }
  .error .cover { display:flex; align-items:center; justify-content:center; padding:12px;
    font-size:12px; color:var(--muted); text-align:center; }
  @keyframes pulse { 50% { opacity:.45; } }

  .arrow { position:absolute; top:calc(50% - 30px); width:44px; height:44px; border-radius:50%;
    border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer;
    font-size:20px; display:none; align-items:center; justify-content:center; z-index:2; }
  .arrow.left { left:12px; } .arrow.right { right:12px; }
  @media (hover:hover) and (min-width:700px) { .arrow { display:flex; } }
</style>
</head>
<body>

<header>
  <h1>I miei album</h1>
  <p>Le mie reference e i dischi che ascolto di più, divisi per genere.</p>
  <p>-----</p>
</header>

<nav id="nav"></nav>
<main id="genres"></main>

<script>
/* I generi e gli album si gestiscono in data/albums.txt:
   "# Genere" apre un genere, ogni riga sotto è un link.
   Opzionale, per correggere i dati:  link | Artista | Titolo */
function parseAlbums(text) {
  const genres = [];
  let cur = null;
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    if (line[0] === "#") {
      const name = line.replace(/^#+\s*/, "");
      if (!name) return;
      cur = genres.find(g => g.name.toLowerCase() === name.toLowerCase());
      if (!cur) { cur = { name, albums: [] }; genres.push(cur); }
      return;
    }
    if (!cur) return;
    const [url, artist, title] = line.split("|").map(x => x.trim());
    if (url) cur.albums.push({ url, artist, title });
  });
  return genres;
}


const CACHE_KEY = "album-cache-v1";
let cache = {};
try { cache = JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; } catch (e) {}
const saveCache = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) {} };

async function fromSpotify(url) {
  const m = url.match(/open\.spotify\.com\/(?:[a-z-]+\/)?(album|track)\/([A-Za-z0-9]+)/);
  if (!m) throw new Error("link Spotify non valido");
  const clean = "https://open.spotify.com/" + m[1] + "/" + m[2];
  const r = await fetch("https://open.spotify.com/oembed?url=" + encodeURIComponent(clean));
  if (!r.ok) throw new Error("Spotify non risponde");
  const d = await r.json();
  let artist = "";
  // L’oEmbed di Spotify non include l’artista: lo cerco su iTunes in base al titolo
  try {
    const s = await fetch("https://itunes.apple.com/search?entity=album&limit=5&term=" + encodeURIComponent(d.title));
    const results = (await s.json()).results || [];
    const hit = results.find(x => x.collectionName.toLowerCase().startsWith(d.title.toLowerCase())) || results[0];
    if (hit) artist = hit.artistName;
  } catch (e) {}
  return { title: d.title, artist, cover: d.thumbnail_url, url: clean };
}

async function fromApple(url) {
  const u = new URL(url);
  const id = u.searchParams.get("i") || u.pathname.split("/").filter(Boolean).pop();
  if (!/^\d+$/.test(id)) throw new Error("link Apple Music non valido");
  const country = (u.pathname.split("/")[1] || "it").slice(0, 2);
  const r = await fetch("https://itunes.apple.com/lookup?id=" + id + "&country=" + country);
  const x = ((await r.json()).results || [])[0];
  if (!x) throw new Error("album non trovato");
  return {
    title: x.collectionName || x.trackName,
    artist: x.artistName,
    cover: (x.artworkUrl100 || "").replace(/\d+x\d+bb/, "600x600bb"),
    url
  };
}

async function resolve(url) {
  if (cache[url]) return cache[url];
  let a;
  if (/open\.spotify\.com/.test(url)) a = await fromSpotify(url);
  else if (/music\.apple\.com/.test(url)) a = await fromApple(url);
  else throw new Error("link non riconosciuto");
  cache[url] = a; saveCache();
  return a;
}

function makeCard() {
  const el = document.createElement("div");
  el.className = "album skeleton";
  el.innerHTML = '<a target="_blank" rel="noopener"><img class="cover" alt=""><p class="title">&nbsp;</p><p class="artist">&nbsp;</p></a>';
  return el;
}

function fill(el, a) {
  el.className = "album";
  el.querySelector("a").href = a.url;
  const img = el.querySelector("img");
  img.src = a.cover; img.alt = "Copertina di " + a.title;
  el.querySelector(".title").textContent = a.title;
  el.querySelector(".artist").textContent = a.artist || "";
}

function fail(el, url, err) {
  el.className = "album error";
  el.innerHTML = '<a href="' + url + '" target="_blank" rel="noopener"><div class="cover">Impossibile caricare<br>questo link</div>' +
    '<p class="title">' + url.replace(/^https?:\/\//, "").slice(0, 40) + '…</p></a>';
  console.warn("Album non risolto:", url, err);
}

const slug = s => "g-" + s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-");

const main = document.getElementById("genres");
const nav = document.getElementById("nav");

function selectGenre(id) {
  main.classList.toggle("single", id !== "all");
  main.classList.toggle("all", id === "all");
  list.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  const act = list.querySelector('button[data-id="' + id + '"]');
  if (act) currentEl.textContent = act.firstChild.textContent;
  main.querySelectorAll(".genre").forEach(sec => { sec.hidden = id !== "all" && sec.id !== id; });
  try { history.replaceState(null, "", id === "all" ? location.pathname : "#" + id); } catch (e) {}
}

// Menu laterale a scomparsa
nav.innerHTML = '<button class="burger" aria-label="Apri menu generi" aria-expanded="false" aria-controls="drawer"><span></span><span></span><span></span></button><span class="current">Tutti i generi</span>';
const burger = nav.querySelector(".burger"), currentEl = nav.querySelector(".current");
const drawer = document.createElement("aside");
drawer.id = "drawer"; drawer.setAttribute("aria-label", "Generi");
drawer.innerHTML = '<div class="drawer-head"><span>Generi</span><button type="button" aria-label="Chiudi menu">×</button></div><ul></ul>';
const scrim = document.createElement("div");
scrim.className = "scrim";
document.body.append(drawer, scrim);
const list = drawer.querySelector("ul");

function setMenu(open) {
  document.body.classList.toggle("menu-open", open);
  burger.setAttribute("aria-expanded", open);
  drawer.inert = !open;
}
setMenu(false);
burger.onclick = () => setMenu(true);
scrim.onclick = () => setMenu(false);
drawer.querySelector(".drawer-head button").onclick = () => setMenu(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });

function addItem(id, label, count) {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.type = "button"; b.dataset.id = id;
  b.innerHTML = "<span></span><small></small>";
  b.firstChild.textContent = label;
  b.lastChild.textContent = count;
  b.onclick = () => { selectGenre(id); setMenu(false); window.scrollTo(0, 0); };
  li.append(b); list.append(li);
}
addItem("all", "Tutti i generi", "");

fetch("data/albums.txt", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error("albums.txt: HTTP " + r.status); return r.text(); })
  .then(parseAlbums)
  .then(GENRES => {

GENRES.filter(g => g.albums && g.albums.length).forEach(g => {
  const id = slug(g.name);

  // Voce nel menu laterale
  addItem(id, g.name, g.albums.length);

  // Sezione
  const sec = document.createElement("section");
  sec.className = "genre"; sec.id = id;
  sec.innerHTML = '<h2></h2><div class="wrap"><button class="arrow left" aria-label="Indietro">‹</button>' +
    '<div class="gallery"></div><button class="arrow right" aria-label="Avanti">›</button></div>';
  const h2 = sec.querySelector("h2");
  h2.textContent = g.name;
  const count = document.createElement("span");
  count.textContent = g.albums.length + (g.albums.length === 1 ? " album" : " album");
  h2.append(count);

  const gallery = sec.querySelector(".gallery");
  const step = () => gallery.clientWidth * 0.8;
  sec.querySelector(".left").onclick = () => gallery.scrollBy({ left: -step() });
  sec.querySelector(".right").onclick = () => gallery.scrollBy({ left: step() });

  g.albums.forEach(item => {
    const o = typeof item === "string" ? { url: item } : item;
    const el = makeCard();
    gallery.append(el);
    resolve(o.url.trim())
      .then(a => fill(el, { ...a, title: o.title || a.title, artist: o.artist || a.artist }))
      .catch(e => fail(el, o.url, e));
  });

  main.append(sec);
});

// Stato iniziale: se l'URL contiene #genere lo apro, altrimenti mostro tutti
selectGenre(document.getElementById(location.hash.slice(1)) && location.hash.length > 1 ? location.hash.slice(1) : "all");

  })
  .catch(err => {
    console.error(err);
    main.innerHTML = '<p style="padding:24px 6vw;color:var(--muted)">Impossibile caricare l’elenco degli album (data/albums.txt).</p>';
  });
</script>
</body>
</html>
