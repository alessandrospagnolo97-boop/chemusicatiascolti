<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I miei album preferiti</title>
<style>
  :root { --bg:#000; --fg:#f1efe9; --muted:#9a9890; --line:#2e2e2b; color-scheme:dark; }
  * { box-sizing: border-box; }
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
  body { margin:0; background:#000; color:var(--fg);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }

  /* Titolo e hint: overlay fisso, non intercetta i gesti */
  header { position:fixed; left:0; right:0; bottom:0; z-index:4; pointer-events:none;
    padding:36px 6vw max(14px,env(safe-area-inset-bottom)); background:linear-gradient(transparent,rgba(0,0,0,.88) 65%); }
  h1 { margin:0 0 4px; font-size:clamp(18px,4vw,28px); letter-spacing:-0.03em; }
  header p { margin:0; color:var(--muted); max-width:52ch; line-height:1.4; font-size:12px; }
  header .hint { margin-top:6px; font:10px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.04em; }

  /* Indice dei generi (fisso sopra il canvas) */
  nav { position:fixed; top:0; left:0; right:0; z-index:5; background:var(--bg); display:flex; align-items:center; gap:14px;
    padding:max(10px,env(safe-area-inset-top)) 6vw 10px; }
  .current { font-size:15px; font-weight:600; }
  /* Menu laterale */
  .burger { width:44px; height:44px; padding:0; border:1px solid var(--line); border-radius:50%; background:var(--bg);
    cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
  .burger span { display:block; width:18px; height:2px; border-radius:2px; background:var(--fg); }
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .25s; z-index:9; }
  #drawer { position:fixed; top:0; left:0; bottom:0; width:min(82vw,300px); z-index:10; display:flex; flex-direction:column;
    background:var(--bg); border-right:1px solid var(--line); transform:translateX(-100%); visibility:hidden;
    transition:transform .25s ease, visibility 0s .25s; }
  body.menu-open #drawer { transform:none; visibility:visible; transition:transform .25s ease; }
  body.menu-open .scrim { opacity:1; pointer-events:auto; }
  .drawer-head { display:flex; align-items:center; justify-content:space-between; padding:18px 20px 10px; font-weight:600; font-size:18px; }
  .drawer-head button { width:40px; height:40px; border:0; background:none; color:var(--fg); font-size:28px; line-height:1; cursor:pointer; }
  #drawer ul { list-style:none; margin:0; padding:0 0 max(16px,env(safe-area-inset-bottom)); overflow-y:auto; flex:1; }
  #drawer li button { width:100%; min-height:48px; padding:12px 20px; border:0; background:none; color:var(--fg); font:inherit; font-size:16px;
    display:flex; justify-content:space-between; align-items:center; gap:12px; text-align:left; cursor:pointer; }
  #drawer li button small { color:var(--muted); font-size:13px; }
  #drawer li button:hover, #drawer li button.active { background:var(--fg); color:var(--bg); }
  #drawer li button.active small, #drawer li button:hover small { color:inherit; opacity:.7; }

  /* Infinite canvas */
  main { position:fixed; inset:0; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none; cursor:grab; background:#000; }
  main.grabbing { cursor:grabbing; }
  .item { position:absolute; left:0; top:0; will-change:transform; transform-origin:0 0; }
  .item[hidden] { display:none; }
  .card { transition:transform .3s cubic-bezier(.2,.7,.2,1); }
  .album a { color:inherit; text-decoration:none; display:block; -webkit-user-drag:none; }
  .cover { width:100%; aspect-ratio:1; object-fit:cover; display:block; border-radius:2px;
    background:var(--line); -webkit-user-drag:none; pointer-events:none; }
  .title, .artist, .dur { margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .title { margin-top:10px; font-weight:600; }
  .artist, .dur { color:var(--muted); }
  .skeleton .cover { animation:pulse 1.2s ease-in-out infinite; }
  .error .cover { display:flex; align-items:center; justify-content:center; padding:12px;
    font-size:12px; color:var(--muted); text-align:center; }
  @keyframes pulse { 50% { opacity:.45; } }
  @media (prefers-reduced-motion:reduce) { .card { transition:none; } }

  /* Vista di un singolo genere: griglia a capo con scroll verticale (come prima), sempre su nero */
  #gtitle { display:none; margin:0; font-size:clamp(20px,3vw,28px); letter-spacing:-0.02em; align-items:baseline; gap:10px; }
  #gtitle span { font-size:13px; color:var(--muted); font-weight:400; letter-spacing:0; }
  main.single { display:flex; flex-wrap:wrap; align-content:flex-start; gap:20px; padding:84px 6vw 130px;
    overflow-y:auto; overflow-x:hidden; touch-action:pan-y; cursor:auto; user-select:auto; -webkit-user-select:auto; }
  main.single #gtitle { display:flex; width:100%; }
  main.single .item { position:relative; width:clamp(150px,20vw,220px) !important; transform:none !important; flex:0 0 auto; }
  body.single-view header .hint { display:none; }
</style>
</head>
<body>

<header>
  <h1>I miei album</h1>
  <p>Le mie reference e i dischi che ascolto di più, divisi per genere.</p>
  <p class="hint">Trascina per esplorare · pizzica per lo zoom</p>
</header>

<nav id="nav"></nav>
<main id="genres"></main>

<script>
/* I generi e gli album si gestiscono in data/albums.txt:
   "# Genere" apre un genere, ogni riga sotto è un link.
   Opzionale, per correggere i dati:  link | Artista | Titolo */
function parseAlbums(text) {
  const genres = [];
  let cur = null;
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    if (line[0] === "#") {
      const name = line.replace(/^#+\s*/, "");
      if (!name) return;
      cur = genres.find(g => g.name.toLowerCase() === name.toLowerCase());
      if (!cur) { cur = { name, albums: [] }; genres.push(cur); }
      return;
    }
    if (!cur) return;
    const [url, artist, title] = line.split("|").map(x => x.trim());
    if (url) cur.albums.push({ url, artist, title });
  });
  return genres;
}


const CACHE_KEY = "album-cache-v3";   // v3: scarta i dati artista/durata errati salvati dalle versioni precedenti
let cache = {};
try { cache = JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; } catch (e) {}
const saveCache = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) {} };

const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "");
const sameTitle = (a, b) => { a = norm(a); b = norm(b); return !!a && !!b && (a.startsWith(b) || b.startsWith(a)); };

// Nome e durata esatti da iTunes per ID. Per gli album somma le tracce, ma solo se sono arrivate tutte.
async function itunesTiming(id, isAlbum, country) {
  const r = await fetch("https://itunes.apple.com/lookup?id=" + id + "&country=" + country + (isAlbum ? "&entity=song&limit=200" : ""));
  const res = (await r.json()).results || [];
  const head = res[0];
  if (!head) return null;
  if (!isAlbum) return { name: head.trackName, ms: head.trackTimeMillis || 0 };
  const tracks = res.filter(x => x.wrapperType === "track");
  const ms = tracks.length && tracks.length === head.trackCount ? tracks.reduce((s, x) => s + (x.trackTimeMillis || 0), 0) : 0;
  return { name: head.collectionName, ms };
}
function fmtDur(ms) {
  if (!ms) return "";
  const min = Math.round(ms / 60000), h = Math.floor(min / 60);
  return h ? h + " h " + String(min % 60).padStart(2, "0") + " min" : min + " min";
}

// song.link (Odesli) collega il link Spotify alla stessa uscita su Apple Music e dà l'artista ufficiale di Spotify.
// Limite gratuito ~10 richieste/minuto: le chiamate vanno in coda, una ogni 6,5 s.
let odesliChain = Promise.resolve();
function odesli(url) {
  const run = () => fetch("https://api.song.link/v1-alpha.1/links?userCountry=IT&url=" + encodeURIComponent(url))
    .then(r => { if (!r.ok) throw new Error("song.link HTTP " + r.status); return r.json(); });
  const p = odesliChain.then(run);
  odesliChain = p.catch(() => {}).then(() => new Promise(r => setTimeout(r, 6500)));
  return p;
}
async function enrichSpotify(clean, base) {
  const d = await odesli(clean);
  const sp = (d.entitiesByUniqueId || {})[d.entityUniqueId];
  if (!sp || !sp.artistName) throw new Error("artista non trovato");
  let duration = 0;
  const am = d.linksByPlatform && d.linksByPlatform.appleMusic;
  const m = am && am.entityUniqueId && am.entityUniqueId.match(/^ITUNES_(ALBUM|SONG)::(\d+)$/);
  if (m) {
    try {
      const t = await itunesTiming(m[2], m[1] === "ALBUM", "it");
      // uso la durata solo se Apple Music indica lo stesso titolo di Spotify
      if (t && sameTitle(t.name, sp.title || base.title)) duration = t.ms;
    } catch (e) {}
  }
  return { ...base, artist: sp.artistName, duration, partial: false };
}

// Spotify: titolo e copertina subito (oEmbed), artista e durata arrivano dopo da fonti verificate.
// Se non si riesce a verificarli restano vuoti, mai indovinati.
async function fromSpotify(url, onUpdate) {
  const m = url.match(/open\.spotify\.com\/(?:[a-z-]+\/)?(album|track)\/([A-Za-z0-9]+)/);
  if (!m) throw new Error("link Spotify non valido");
  const clean = "https://open.spotify.com/" + m[1] + "/" + m[2];
  const r = await fetch("https://open.spotify.com/oembed?url=" + encodeURIComponent(clean));
  if (!r.ok) throw new Error("Spotify non risponde");
  const d = await r.json();
  const base = { title: d.title, artist: "", duration: 0, cover: d.thumbnail_url, url: clean, partial: true };
  enrichSpotify(clean, base)
    .then(full => { cache[url] = full; saveCache(); if (onUpdate) onUpdate(full); })
    .catch(e => console.warn("Artista/durata Spotify non verificati:", url, e));
  return base;
}

async function fromApple(url) {
  const u = new URL(url);
  const id = u.searchParams.get("i") || u.pathname.split("/").filter(Boolean).pop();
  if (!/^\d+$/.test(id)) throw new Error("link Apple Music non valido");
  const country = (u.pathname.split("/")[1] || "it").slice(0, 2);
  const r = await fetch("https://itunes.apple.com/lookup?id=" + id + "&country=" + country);
  const x = ((await r.json()).results || [])[0];
  if (!x) throw new Error("album non trovato");
  let duration = 0;
  try {
    const t = await itunesTiming(id, x.wrapperType !== "track", country);
    if (t) duration = t.ms;
  } catch (e) {}
  return {
    title: x.collectionName || x.trackName,
    artist: x.artistName,
    duration,
    cover: (x.artworkUrl100 || "").replace(/\d+x\d+bb/, "600x600bb"),
    url
  };
}

async function resolve(url, onUpdate) {
  if (cache[url]) return cache[url];
  let a;
  if (/open\.spotify\.com/.test(url)) { a = await fromSpotify(url, onUpdate); if (a.partial) return a; }
  else if (/music\.apple\.com/.test(url)) a = await fromApple(url);
  else throw new Error("link non riconosciuto");
  cache[url] = a; saveCache();
  return a;
}

function makeCard() {
  const el = document.createElement("div");
  el.className = "item album skeleton";
  el.innerHTML = '<div class="card"><a target="_blank" rel="noopener" draggable="false"><img class="cover" alt="" draggable="false" decoding="async">' +
    '<p class="title">&nbsp;</p><p class="artist">&nbsp;</p><p class="dur">&nbsp;</p></a></div>';
  return el;
}

function fill(el, a) {
  el.classList.remove("skeleton");
  el.querySelector("a").href = a.url;
  const img = el.querySelector("img");
  img.src = a.cover; img.alt = "Copertina di " + a.title;
  el.querySelector(".title").textContent = a.title;
  el.querySelector(".artist").textContent = a.artist || "";
  el.querySelector(".dur").textContent = fmtDur(a.duration);
}

function fail(el, url, err) {
  el.classList.remove("skeleton"); el.classList.add("error");
  el.querySelector(".card").innerHTML = '<a href="' + url + '" target="_blank" rel="noopener" draggable="false"><div class="cover">Impossibile caricare<br>questo link</div>' +
    '<p class="title">' + url.replace(/^https?:\/\//, "").slice(0, 40) + '…</p></a>';
  console.warn("Album non risolto:", url, err);
}

const slug = s => "g-" + s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-");

const main = document.getElementById("genres");
const gtitle = document.createElement("h2");
gtitle.id = "gtitle";
main.append(gtitle);
const nav = document.getElementById("nav");

/* ---------- Infinite canvas ---------- */
const TXT = 58;                     // altezza riservata al testo sotto la copertina
const items = [];                   // { el, genre, bx, by, sz }
let active = [], W = 1, H = 1, CW = 1, CH = 1, lastSig = "";
const cam = { x: 0, y: 0 };
let vx = 0, vy = 0, raf = 0, last = 0, single = false;
const ZMIN = 0.55, ZMAX = 1.6;      // limiti dello zoom
let z = 1;
const clampZ = v => Math.min(ZMAX, Math.max(ZMIN, v));
// Zoom attorno al punto (cx,cy) dello schermo: il punto sotto le dita resta fermo
function setZoom(nz, cx, cy) {
  nz = clampZ(nz);
  cam.x += cx / nz - cx / z; cam.y += cy / nz - cy / z; z = nz;
}

function mulberry32(a) {            // PRNG con seed fisso: layout stabile
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const wrap = (v, size, off) => ((v - off) % size + size) % size + off;

function render() {
  for (const it of active) {
    const x = wrap(it.bx + cam.x, W, -CW) * z, y = wrap(it.by + cam.y, H, -CH) * z;
    it.el.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0) scale(" + z.toFixed(3) + ")";
  }
}

/* Il "mondo" è una tessera W×H, più grande dello schermo, che si ripete all'infinito:
   ogni album compare una volta sola e viene riposizionato quando esce dallo schermo.
   Ogni album vive in una propria cella con jitter casuale → nessuna sovrapposizione. */
function layout(force) {
  if (single) { active = []; lastSig = ""; return; }   // vista genere: griglia CSS, nessun posizionamento
  const vw = window.innerWidth, vh = window.innerHeight;
  const S = Math.round(Math.min(Math.max(Math.min(vw, vh) * 0.36, 124), 210) / 4) * 4;
  active = items.filter(it => !it.el.hidden);
  const n = Math.max(active.length, 1);
  const cw = Math.round(S * 1.3), ch = Math.round(S * 1.12 + TXT);
  const minC = Math.ceil((vw / ZMIN + cw) / cw), minR = Math.ceil((vh / ZMIN + ch) / ch);
  const cols = Math.max(minC, Math.ceil(Math.sqrt(n * ch / cw)));
  const rows = Math.max(minR, Math.ceil(n / cols));
  const sig = [S, cols, rows, active.length].join();
  if (!force && sig === lastSig) return;
  lastSig = sig;
  CW = cw; CH = ch; W = cols * cw; H = rows * ch;

  const rng = mulberry32(20240607);
  const cells = Array.from({ length: cols * rows }, (_, i) => i);
  for (let i = cells.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [cells[i], cells[j]] = [cells[j], cells[i]]; }
  active.forEach((it, i) => {
    const c = cells[i], sz = Math.round(S * (0.72 + 0.28 * rng()));
    it.sz = sz; it.el.style.width = sz + "px";
    it.bx = (c % cols) * cw + rng() * (cw - sz);
    it.by = Math.floor(c / cols) * ch + rng() * (ch - sz - TXT);
  });
  render();
}

function tick(t) {
  raf = 0;
  const dt = Math.min(32, t - last || 16); last = t;
  if (!dragging) {
    const f = Math.pow(0.95, dt / 16.67);
    vx *= f; vy *= f; cam.x += vx * dt; cam.y += vy * dt;
  }
  render();
  if (dragging || Math.hypot(vx, vy) > 0.01) raf = requestAnimationFrame(tick);
}
function kick() { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } }

// Trascinamento (mouse, touch, penna) con inerzia + pinch a due dita
const ptrs = new Map();
let down = false, dragging = false, justDragged = false, pid = 0, sx = 0, sy = 0, lx = 0, ly = 0, lt = 0, pinch = null;
function startPinch() {
  const [a, b] = [...ptrs.values()];
  pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  down = true; dragging = true; justDragged = true; vx = vy = 0;
  for (const id of ptrs.keys()) { try { main.setPointerCapture(id); } catch (err) {} }
  main.classList.add("grabbing"); kick();
}
main.addEventListener("pointerdown", e => {
  if (single || (e.pointerType === "mouse" && e.button !== 0)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { startPinch(); return; }
  if (ptrs.size > 2) return;
  down = true; dragging = false; pid = e.pointerId;
  sx = lx = e.clientX; sy = ly = e.clientY; lt = e.timeStamp; vx = vy = 0;
});
main.addEventListener("pointermove", e => {
  const p = ptrs.get(e.pointerId);
  if (p) { p.x = e.clientX; p.y = e.clientY; }
  if (pinch) {
    if (ptrs.size < 2) return;
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    setZoom(pinch.z * d / pinch.d, mx, my);
    cam.x += (mx - pinch.mx) / z; cam.y += (my - pinch.my) / z;
    pinch.mx = mx; pinch.my = my; kick(); return;
  }
  if (!down || e.pointerId !== pid) return;
  if (!dragging) {
    if (Math.hypot(e.clientX - sx, e.clientY - sy) < 6) return;   // soglia: sotto è un tap/click
    dragging = true; justDragged = true;
    try { main.setPointerCapture(pid); } catch (err) {}
    main.classList.add("grabbing");
    lx = e.clientX; ly = e.clientY; lt = e.timeStamp; kick(); return;
  }
  const dt = Math.max(1, e.timeStamp - lt), dx = (e.clientX - lx) / z, dy = (e.clientY - ly) / z;
  cam.x += dx; cam.y += dy;
  vx = 0.8 * (dx / dt) + 0.2 * vx; vy = 0.8 * (dy / dt) + 0.2 * vy;
  lx = e.clientX; ly = e.clientY; lt = e.timeStamp;
});
function endDrag(e) {
  ptrs.delete(e.pointerId);
  if (pinch) {
    if (ptrs.size >= 2) return;
    pinch = null; vx = vy = 0;
    if (ptrs.size === 1) {            // un dito resta: riprendo il trascinamento da lì
      const [id, p] = [...ptrs][0];
      pid = id; down = true; dragging = true; lx = p.x; ly = p.y; lt = e.timeStamp; return;
    }
    down = false; dragging = false;
    main.classList.remove("grabbing"); kick();
    setTimeout(() => { justDragged = false; }, 60);
    return;
  }
  if (!down || e.pointerId !== pid) return;
  down = false;
  if (dragging) {
    dragging = false;
    if (e.type === "pointercancel" || e.timeStamp - lt > 80) vx = vy = 0;
    main.classList.remove("grabbing");
    kick();
    setTimeout(() => { justDragged = false; }, 60);
  }
}
main.addEventListener("pointerup", endDrag);
main.addEventListener("pointercancel", endDrag);
// Dopo un trascinamento il click sul link viene bloccato; un tap semplice funziona come prima
main.addEventListener("click", e => { if (justDragged) { e.preventDefault(); e.stopPropagation(); } }, true);
main.addEventListener("dragstart", e => e.preventDefault());

// Trackpad / rotella (ctrl + rotella o pinch da trackpad = zoom)
main.addEventListener("wheel", e => {
  if (single) return;                // nella vista genere scorre normalmente
  e.preventDefault();
  const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? window.innerHeight : 1;
  let dx = e.deltaX * k, dy = e.deltaY * k;
  if (e.ctrlKey) { setZoom(z * Math.exp(-dy * 0.01), e.clientX, e.clientY); vx = vy = 0; kick(); return; }
  if (e.shiftKey && !dx) { dx = dy; dy = 0; }
  cam.x -= dx / z; cam.y -= dy / z; vx = vy = 0; kick();
}, { passive: false });

let rzPending = false;
window.addEventListener("resize", () => {
  if (rzPending) return; rzPending = true;
  requestAnimationFrame(() => { rzPending = false; layout(false); render(); });
});

// Hover: leggero ingrandimento + effetto magnetico (solo mouse)
const canHover = window.matchMedia("(hover:hover) and (pointer:fine)").matches &&
  !window.matchMedia("(prefers-reduced-motion:reduce)").matches;
function addMagnet(it) {
  const card = it.el.querySelector(".card");
  it.el.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse" || dragging || down) return;
    const r = it.el.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width / 2)) * 0.12, dy = (e.clientY - (r.top + r.width / 2)) * 0.12;
    card.style.transform = "translate3d(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px,0) scale(1.06)";
  });
  it.el.addEventListener("pointerleave", () => { card.style.transform = ""; });
}

function selectGenre(id) {
  list.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  const act = list.querySelector('button[data-id="' + id + '"]');
  if (act) currentEl.textContent = act.firstChild.textContent;
  single = id !== "all";
  main.classList.toggle("single", single);
  document.body.classList.toggle("single-view", single);
  if (act && single) {
    gtitle.textContent = act.firstChild.textContent;
    const c = document.createElement("span"); c.textContent = act.lastChild.textContent + " album"; gtitle.append(c);
  }
  items.forEach(it => { it.el.hidden = single && it.genre !== id; });
  main.scrollTop = 0;
  cam.x = 0; cam.y = 70 / z; vx = vy = 0;
  layout(true);
  try { history.replaceState(null, "", id === "all" ? location.pathname : "#" + id); } catch (e) {}
}

// Menu laterale a scomparsa
nav.innerHTML = '<button class="burger" aria-label="Apri menu generi" aria-expanded="false" aria-controls="drawer"><span></span><span></span><span></span></button><span class="current">Tutti i generi</span>';
const burger = nav.querySelector(".burger"), currentEl = nav.querySelector(".current");
const drawer = document.createElement("aside");
drawer.id = "drawer"; drawer.setAttribute("aria-label", "Generi");
drawer.innerHTML = '<div class="drawer-head"><span>Generi</span><button type="button" aria-label="Chiudi menu">×</button></div><ul></ul>';
const scrim = document.createElement("div");
scrim.className = "scrim";
document.body.append(drawer, scrim);
const list = drawer.querySelector("ul");

function setMenu(open) {
  document.body.classList.toggle("menu-open", open);
  burger.setAttribute("aria-expanded", open);
  drawer.inert = !open;
}
setMenu(false);
burger.onclick = () => setMenu(true);
scrim.onclick = () => setMenu(false);
drawer.querySelector(".drawer-head button").onclick = () => setMenu(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });

function addItem(id, label, count) {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.type = "button"; b.dataset.id = id;
  b.innerHTML = "<span></span><small></small>";
  b.firstChild.textContent = label;
  b.lastChild.textContent = count;
  b.onclick = () => { selectGenre(id); setMenu(false); };
  li.append(b); list.append(li);
}
addItem("all", "Tutti i generi", "");

fetch("data/albums.txt", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error("albums.txt: HTTP " + r.status); return r.text(); })
  .then(parseAlbums)
  .then(GENRES => {

GENRES.filter(g => g.albums && g.albums.length).forEach(g => {
  const id = slug(g.name);

  // Voce nel menu laterale
  addItem(id, g.name, g.albums.length);

  g.albums.forEach(item => {
    const o = typeof item === "string" ? { url: item } : item;
    const el = makeCard();
    const it = { el, genre: id, bx: 0, by: 0, sz: 0 };
    items.push(it);
    if (canHover) addMagnet(it);
    main.append(el);
    const apply = a => fill(el, { ...a, title: o.title || a.title, artist: o.artist || a.artist });
    resolve(o.url.trim(), apply).then(apply).catch(e => fail(el, o.url, e));
  });
});

// Stato iniziale: se l'URL contiene #genere lo apro, altrimenti mostro tutti
const h = location.hash.slice(1);
selectGenre(h && list.querySelector('button[data-id="' + CSS.escape(h) + '"]') ? h : "all");

  })
  .catch(err => {
    console.error(err);
    main.innerHTML = '<p style="padding:90px 6vw 0;color:var(--muted)">Impossibile caricare l’elenco degli album (data/albums.txt).</p>';
  });
</script>
